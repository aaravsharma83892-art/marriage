<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marriage Registration - AI Portal</title>
    <style>
        :root {
            --primary-color: #075e54;
            --secondary-color: #25d366;
            --accent-color: #34b7f1;
            --bg-color: #ece5dd;
            --card-bg: #ffffff;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 10px; color: #333; }
        .form-container { background: var(--card-bg); padding: 20px; border-radius: 15px; max-width: 500px; margin: 10px auto; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
        .header { text-align: center; border-bottom: 3px solid var(--secondary-color); margin-bottom: 25px; padding-bottom: 10px; }
        .header h2 { margin: 0; color: var(--primary-color); }
        .section-title { background: linear-gradient(90deg, var(--primary-color), var(--accent-color)); padding: 12px; margin: 25px 0 15px 0; border-radius: 8px; color: white; font-weight: bold; font-size: 14px; }
        
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--primary-color); font-size: 14px; }
        input, textarea, select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; transition: border 0.3s; }
        input:focus { border-color: var(--accent-color); outline: none; }

        .ai-panel { background: #f0f7f4; border: 2px dashed var(--accent-color); padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; }
        .btn-row { display: flex; gap: 10px; justify-content: center; }
        .scan-btn { background: var(--accent-color); color: white; border: none; padding: 12px; border-radius: 25px; cursor: pointer; font-weight: bold; flex: 1; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .back-btn { background: #555 !important; }
        
        .loader { display: none; border: 3px solid #f3f3f3; border-top: 3px solid var(--accent-color); border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .status-msg { font-size: 11px; display: block; margin-top: 8px; font-weight: bold; min-height: 15px; color: #666; }
        .manual-input { display: none; margin-top: 10px; }
        button#submitBtn { width: 100%; padding: 16px; background: var(--secondary-color); color: white; border: none; border-radius: 50px; cursor: pointer; font-size: 1.1rem; font-weight: bold; margin-top: 20px; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header">
        <h2>Marriage Registration</h2>
        <p style="font-size: 12px; color: #666;">AI Portal v2.1 | Dev By Kr09</p>
    </div>

    <form id="marriageForm">
        <div class="form-group">
            <label>Legal Advocate</label>
            <select id="advocateSelect" onchange="toggleManual('advocateSelect', 'manualAdvocateDiv', 'manualAdvocateName')" required>
                <option value="">-- Select Advocate --</option>
                <option value="Dev Tyagi">Dev Tyagi</option>
                <option value="Shiva Gupta">Shiva Gupta</option>
                <option value="Ashish">Ashish</option>
                <option value="Rahul Dev">Rahul Dev</option>
                <option value="Abhishek">Abhishek</option>
                <option value="Monu">Monu</option>
                <option value="Moolchand">Moolchand</option>
                <option value="Danish Boss">Danish Boss</option>
                <option value="Manual">✎ Manual Fill</option>
            </select>
            <div id="manualAdvocateDiv" class="manual-input"><input type="text" id="manualAdvocateName" placeholder="Type Advocate Name"></div>
        </div>

        <div class="section-title">♂ BOY'S INFORMATION</div>
        <div class="ai-panel">
            <div id="boyLoader" class="loader"></div>
            <div class="btn-row">
                <button type="button" class="scan-btn" onclick="document.getElementById('boyFront').click()">📷 Front</button>
                <button type="button" class="scan-btn back-btn" onclick="document.getElementById('boyBack').click()">📷 Back</button>
            </div>
            <input type="file" id="boyFront" accept="image/*" style="display:none" onchange="processAI(this, 'boy', 'front')">
            <input type="file" id="boyBack" accept="image/*" style="display:none" onchange="processAI(this, 'boy', 'back')">
            <span id="boyStatus" class="status-msg">Scan ID to Auto-Fill</span>
        </div>

        <div class="form-group"><label>Full Name</label><input type="text" id="boyName" required></div>
        <div class="form-group"><label>Mother's Name</label><input type="text" id="boyMother" required></div>
        <div class="form-group"><label>Father's Name</label><input type="text" id="boyFather" required></div>
        <div class="form-group"><label>Date of Birth</label><input type="date" id="boyDob" required></div>
        <div class="form-group"><label>Residential Address</label><textarea id="boyAddress" rows="3" required></textarea></div>
        <div class="form-group"><label>Pincode</label><input type="number" id="boyPincode" required></div>

        <div class="section-title">♀ GIRL'S INFORMATION</div>
        <div class="ai-panel">
            <div id="girlLoader" class="loader"></div>
            <div class="btn-row">
                <button type="button" class="scan-btn" onclick="document.getElementById('girlFront').click()">📷 Front</button>
                <button type="button" class="scan-btn back-btn" onclick="document.getElementById('girlBack').click()">📷 Back</button>
            </div>
            <input type="file" id="girlFront" accept="image/*" style="display:none" onchange="processAI(this, 'girl', 'front')">
            <input type="file" id="girlBack" accept="image/*" style="display:none" onchange="processAI(this, 'girl', 'back')">
            <span id="girlStatus" class="status-msg">Scan ID to Auto-Fill</span>
        </div>

        <div class="form-group"><label>Full Name</label><input type="text" id="girlName" required></div>
        <div class="form-group"><label>Mother's Name</label><input type="text" id="girlMother" required></div>
        <div class="form-group"><label>Father's Name</label><input type="text" id="girlFather" required></div>
        <div class="form-group"><label>Date of Birth</label><input type="date" id="girlDob" required></div>
        <div class="form-group"><label>Residential Address</label><textarea id="girlAddress" rows="3" required></textarea></div>
        <div class="form-group"><label>Pincode</label><input type="number" id="girlPincode" required></div>

        <div class="section-title">💍 MARRIAGE DETAILS</div>
        <div class="form-group">
            <label>Marriage Center</label>
            <select id="centerSelect" onchange="toggleManual('centerSelect', 'manualCenterDiv', 'manualCenterName')" required>
                <option value="">-- Select Center --</option>
                <option value="Naitik Vaidik Sanskar Samiti Regd. Gandhi Nagar, Ghaziabad">Naitik Vaidik Sanskar Samiti Regd. Gandhi Nagar, Ghaziabad</option>
                <option value="Moti Mahal Masjid, Kella Bhatta, Ghaziabad">Moti Mahal Masjid, Kella Bhatta, Ghaziabad</option>
                <option value="Arya Samaj Vivah Uthan Kendra, Old Vijay Nagar, Ghaziabad">Arya Samaj Vivah Uthan Kendra, Old Vijay Nagar, Ghaziabad</option>
                <option value="Manual">✎ Manual Fill</option>
            </select>
            <div id="manualCenterDiv" class="manual-input"><input type="text" id="manualCenterName" placeholder="Type Center Name"></div>
        </div>
        <div class="form-group"><label>Marriage Date</label><input type="date" id="marriageDate" required></div>

        <div class="section-title">👥 WITNESSES</div>
        <div class="form-group">
            <label>Witness 1</label>
            <select id="w1Select" onchange="handleWitnessChange(1)" required>
                <option value="">-- Select Witness 1 --</option>
                <option value="Vipin Tyagi">Vipin Tyagi</option>
                <option value="Mohd Furqan">Mohd Furqan</option>
                <option value="Narayan">Narayan</option>
                <option value="Manual">✎ Manual Fill</option>
            </select>
            <div id="manualW1Div" class="manual-input"><input type="text" id="manualW1Name" placeholder="Witness Name"></div>
        </div>
        <div class="form-group"><label>Witness 1 Address</label><textarea id="w1Address" rows="2" required></textarea></div>

        <div class="form-group">
            <label>Witness 2</label>
            <select id="w2Select" onchange="handleWitnessChange(2)" required>
                <option value="">-- Select Witness 2 --</option>
                <option value="Sangeeta Kumar">Sangeeta Kumar</option>
                <option value="Soniya Soni">Soniya Soni</option>
                <option value="VIPIN KUMAR">VIPIN KUMAR</option>
                <option value="Bittu">Bittu</option>
                <option value="Manual">✎ Manual Fill</option>
            </select>
            <div id="manualW2Div" class="manual-input"><input type="text" id="manualW2Name" placeholder="Witness Name"></div>
        </div>
        <div class="form-group"><label>Witness 2 Address</label><textarea id="w2Address" rows="2" required></textarea></div>

        <button type="submit" id="submitBtn">Send via WhatsApp</button>
    </form>
</div>

<script>
    const GROQ_API_KEY = "REPLACE_ME_WITH_REAL_KEY"; 
    const MODEL_ID = "meta-llama/llama-4-maverick-17b-128e-instruct"; 

    const ADDRESSES = {
        "Vipin Tyagi": "H No Ff25, Gali No 7, Budh Bazar Vijay Nagar, Sain Vihar, Ghaziabad, Uttar Pradesh 201001",
        "Mohd Furqan": "House No 939, Near New Masjid Behind Police Chowki, Kaila Bhatta, Ghaziabad, Uttar Pradesh 201001",
        "Narayan": "Rasoolpur Gujran, Shamli, Rasulpur Gujran, Uttar Pradesh 247775",
        "Sangeeta Kumar": "House No 136 Loni Ghaziabad 201102",
        "Soniya Soni": "House Number A 1, Street Number 2, Harijan Basti, Karawal Nagar, Dayalpur, Delhi 110094",
        "VIPIN KUMAR": "165 NEW VIKAS NAGAR LONI GHAZIABAD 201102",
        "Bittu": "S/O Prahlad Singh, H No 45/3, Shanti Vihar, Karhal, Mainpuri, Uttar Pradesh 205264"
    };

    window.onload = () => {
        const today = new Date();
        const boyLimit = new Date(today.getFullYear() - 21, today.getMonth(), today.getDate()).toISOString().split('T')[0];
        const girlLimit = new Date(today.getFullYear() - 18, today.getMonth(), today.getDate()).toISOString().split('T')[0];
        document.getElementById('boyDob').setAttribute('max', boyLimit);
        document.getElementById('girlDob').setAttribute('max', girlLimit);
    };

    async function processAI(input, prefix, side) {
        const status = document.getElementById(prefix + 'Status');
        const loader = document.getElementById(prefix + 'Loader');
        if (!input.files[0]) return;

        status.innerText = `⏳ Processing ${side.toUpperCase()}...`;
        status.style.color = "#34b7f1";
        loader.style.display = "block";

        const sideInstructions = side === 'front' 
            ? "Extract ONLY: name, dob (YYYY-MM-DD), and father_name if visible. Ignore address." 
            : "Extract ONLY: address, pincode, and father_name. Ignore name and dob.";

        try {
            const base64Data = await resizeImage(input.files[0]);
            
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${GROQ_API_KEY}`, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({
                    model: MODEL_ID,
                    messages: [{
                        role: "user",
                        content: [
                            { type: "text", text: `Return JSON ONLY for Indian ID. ${sideInstructions} Do not return null for fields you cannot see.` },
                            { type: "image_url", image_url: { url: base64Data } }
                        ]
                    }],
                    response_format: { type: "json_object" },
                    temperature: 0
                })
            });

            const result = await response.json();
            if (!response.ok) throw new Error(result.error?.message || "Scan Failed");

            const info = JSON.parse(result.choices[0].message.content);

            const setVal = (id, val) => {
                const element = document.getElementById(id);
                if(val && val.toString().toLowerCase() !== "null" && val !== "") {
                    // Only update if current field is empty
                    if (element.value.trim() === "") {
                        element.value = val;
                    }
                }
            };

            if (side === 'front') {
                setVal(prefix + 'Name', info.name || info.Name);
                setVal(prefix + 'Father', info.father_name || info.father || info.Father || info.care_of);
                setVal(prefix + 'Dob', info.dob || info.DOB || info.date_of_birth);
            } else {
                setVal(prefix + 'Address', info.address || info.Address);
                setVal(prefix + 'Pincode', info.pincode || info.Pincode || info.pin);
                setVal(prefix + 'Father', info.father_name || info.father || info.Father || info.care_of);
            }

            status.innerText = `✅ ${side.toUpperCase()} Scan Successful`;
            status.style.color = "green";
        } catch (e) {
            console.error(e);
            status.innerText = "❌ Scan Error. Try again.";
            status.style.color = "red";
        } finally { loader.style.display = "none"; }
    }

    function resizeImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scale = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
            };
        });
    }

    function toggleManual(selId, divId, inpId) {
        const sel = document.getElementById(selId);
        const div = document.getElementById(divId);
        const inp = document.getElementById(inpId);
        div.style.display = (sel.value === "Manual") ? 'block' : 'none';
        if (sel.value === "Manual") inp.setAttribute('required', 'true');
        else inp.removeAttribute('required');
    }

    function handleWitnessChange(num) {
        const sel = document.getElementById(`w${num}Select`);
        const addr = document.getElementById(`w${num}Address`);
        toggleManual(`w${num}Select`, `manualW${num}Div`, `manualW${num}Name`);
        if (ADDRESSES[sel.value]) addr.value = ADDRESSES[sel.value];
    }

    function formatWaDate(dateVal) {
        if(!dateVal) return "";
        const [y, m, d] = dateVal.split('-');
        return `${d}/${m}/${y}`;
    }

    document.getElementById('marriageForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const getVal = (sId, mId) => document.getElementById(sId).value === "Manual" ? document.getElementById(mId).value : document.getElementById(sId).value;

        let msg = `*MARRIAGE REGISTRATION DETAILS*%0A%0A`;
        msg += `*Advocate:* ${getVal('advocateSelect', 'manualAdvocateName')}%0A%0A`;
        msg += `*♂ BOY'S INFO*%0A`;
        msg += `Name: ${document.getElementById('boyName').value}%0A`;
        msg += `Mother: ${document.getElementById('boyMother').value}%0A`;
        msg += `Father: ${document.getElementById('boyFather').value}%0A`;
        msg += `DOB: ${formatWaDate(document.getElementById('boyDob').value)}%0A`;
        msg += `Address: ${document.getElementById('boyAddress').value} - ${document.getElementById('boyPincode').value}%0A%0A`;
        msg += `*♀ GIRL'S INFO*%0A`;
        msg += `Name: ${document.getElementById('girlName').value}%0A`;
        msg += `Mother: ${document.getElementById('girlMother').value}%0A`;
        msg += `Father: ${document.getElementById('girlFather').value}%0A`;
        msg += `DOB: ${formatWaDate(document.getElementById('girlDob').value)}%0A`;
        msg += `Address: ${document.getElementById('girlAddress').value} - ${document.getElementById('girlPincode').value}%0A%0A`;
        msg += `*💍 MARRIAGE*%0A`;
        msg += `Center: ${getVal('centerSelect', 'manualCenterName')}%0A`;
        msg += `Date: ${formatWaDate(document.getElementById('marriageDate').value)}%0A%0A`;
        msg += `*👥 WITNESSES*%0A`;
        msg += `W1: ${getVal('w1Select', 'manualW1Name')}%0A`;
        msg += `W1 Add: ${document.getElementById('w1Address').value}%0A%0A`;
        msg += `W2: ${getVal('w2Select', 'manualW2Name')}%0A`;
        msg += `W2 Add: ${document.getElementById('w2Address').value}`;

        window.open(`https://wa.me/919990150544?text=${msg}`, '_blank');
    });
</script>
</body>
</html>
