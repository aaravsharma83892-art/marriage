<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marriage Registration Portal</title>
    <style>
        :root {
            --primary-color: #075e54;
            --secondary-color: #25d366;
            --accent-color: #34b7f1;
            --bg-color: #ece5dd;
            --card-bg: #ffffff;
            --text-main: #333333;
            --warning-red: #d32f2f;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); margin: 0; padding: 10px; }
        .form-container { background: var(--card-bg); padding: 20px; border-radius: 15px; max-width: 500px; margin: 10px auto; box-sizing: border-box; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
        
        .header { text-align: center; border-bottom: 3px solid var(--secondary-color); margin-bottom: 25px; padding-bottom: 10px; }
        h2 { color: var(--primary-color); margin: 0; }

        .section-title { background: linear-gradient(90deg, var(--primary-color), var(--accent-color)); padding: 10px; margin: 25px 0 15px 0; border-radius: 8px; color: white; font-weight: bold; }
        
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--primary-color); }
        input, textarea, select { width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .warning-box { 
            background-color: #fff4f4; border: 2px solid var(--warning-red); padding: 15px; 
            border-radius: 8px; margin-top: 25px; color: var(--warning-red); 
            text-align: center; font-weight: bold; animation: blink 1.5s infinite;
        }

        .agreement-section { margin: 20px 0; display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .agreement-section input { width: 20px; height: 20px; cursor: pointer; }

        button { 
            width: 100%; padding: 16px; background: var(--secondary-color); color: white; 
            border: none; border-radius: 50px; cursor: pointer; font-size: 1.1rem; font-weight: bold;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4); transition: 0.3s;
        }

        button:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }
        .manual-input { display: none; margin-top: 12px; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header">
        <h2>Marriage Registration</h2>
        <p>WhatsApp Submission Portal 2026</p>
    </div>

    <form id="marriageForm">
        <div class="form-group">
            <label>Legal Advocate</label>
            <select id="advocateSelect" onchange="toggleManual('advocateSelect', 'manualAdvocateDiv', 'manualAdvocateName')" required>
                <option value="">-- Select Advocate --</option>
                <option value="Dev Tyagi">Dev Tyagi</option>
                <option value="Shiva Gupta">Shiva Gupta</option>
                <option value="Sangeeta">Sangeeta</option>
                <option value="Soni">Soni</option>
                <option value="Soni">Abhishek</option>
                <option value="Soni">Moolchand</option>
                <option value="Soni">Yogesh</option>
                <option value="Soni">AK</option>
                <option value="Manual">✎ Manual Fill</option>
            </select>
            <div id="manualAdvocateDiv" class="manual-input">
                <input type="text" id="manualAdvocateName" placeholder="Type Advocate Name">
            </div>
        </div>

        <div class="section-title">♂ Boy's Information</div>
        <div class="form-group"><label>Full Name</label><input type="text" id="boyName" required></div>
        <div class="form-group"><label>Mother's Name</label><input type="text" id="boyMother" required></div>
        <div class="form-group"><label>Father's Name</label><input type="text" id="boyFather" required></div>
        <div class="form-group"><label>Date of Birth</label><input type="date" id="boyDob" required></div>
        <div class="form-group"><label>Residential Address</label><textarea id="boyAddress" rows="3" required></textarea></div>
        <div class="form-group"><label>Pincode</label><input type="number" id="boyPincode" required></div>

        <div class="section-title">♀ Girl's Information</div>
        <div class="form-group"><label>Full Name</label><input type="text" id="girlName" required></div>
        <div class="form-group"><label>Mother's Name</label><input type="text" id="girlMother" required></div>
        <div class="form-group"><label>Father's Name</label><input type="text" id="girlFather" required></div>
        <div class="form-group"><label>Date of Birth</label><input type="date" id="girlDob" required></div>
        <div class="form-group"><label>Residential Address</label><textarea id="girlAddress" rows="3" required></textarea></div>
        <div class="form-group"><label>Pincode</label><input type="number" id="girlPincode" required></div>

        <div class="section-title">💍 Marriage Details</div>
        <div class="form-group">
            <label>Marriage Center</label>
            <select id="centerSelect" onchange="toggleManual('centerSelect', 'manualCenterDiv', 'manualCenterName')" required>
                <option value="">-- Select Center --</option>
                <option value="Naitik Vaidik Sanskar Samiti Regd. Gandhi Nagar, Ghaziabad">Naitik Vaidik Sanskar Samiti Regd. Gandhi Nagar, Ghaziabad</option>
                <option value="Manual">✎ Manual Fill</option>
            </select>
            <div id="manualCenterDiv" class="manual-input">
                <input type="text" id="manualCenterName" placeholder="Type Center Name">
            </div>
        </div>
        <div class="form-group"><label>Marriage Date</label><input type="date" id="marriageDate" required></div>

        <div class="section-title">👥 Witnesses</div>
        <div class="form-group">
            <label>Witness 1</label>
            <select id="w1Select" onchange="handleWitnessChange(1)" required>
                <option value="">-- Select Witness 1 --</option>
                <option value="Vipin Tyagi">Vipin Tyagi</option>
                <option value="Manual">✎ Manual Fill</option>
            </select>
            <div id="manualW1Div" class="manual-input"><input type="text" id="manualW1Name" placeholder="Witness Name"></div>
        </div>
        <div class="form-group"><label>Witness 1 Address</label><textarea id="w1Address" rows="2" required></textarea></div>

        <div class="form-group">
            <label>Witness 2</label>
            <select id="w2Select" onchange="handleWitnessChange(2)" required>
                <option value="">-- Select Witness 2 --</option>
                <option value="Sangeeta Kumar">Sangeeta Kumar</option>
                <option value="Soniya Soni">Soniya Soni</option>
                <option value="VIPIN KUMAR">VIPIN KUMAR</option>
                <option value="Manual">✎ Manual Fill</option>
            </select>
            <div id="manualW2Div" class="manual-input"><input type="text" id="manualW2Name" placeholder="Witness Name"></div>
        </div>
        <div class="form-group"><label>Witness 2 Address</label><textarea id="w2Address" rows="2" required></textarea></div>

        <div class="warning-box">
            चेतावनी: फॉर्म ध्यान से भरें, बाद में हमारी कोई जिम्मेदारी नहीं होगी।
        </div>

        <div class="agreement-section">
            <input type="checkbox" id="agreeCheckbox" onchange="document.getElementById('submitBtn').disabled = !this.checked">
            <label for="agreeCheckbox">I Agree / मैं सहमत हूँ</label>
        </div>

        <button type="submit" id="submitBtn" disabled>Send via WhatsApp</button>
    </form>
</div>

<script>
    const ADDRESSES = {
        "Vipin Tyagi": "H No Ff25, Gali No 7, Budh Bazar Vijay Nagar, Sain Vihar, Ghaziabad, Uttar Pradesh 201001",
        "Sangeeta Kumar": "House No 136 Loni Ghaziabad 201102",
        "Soniya Soni": "House Number A 1, Street Number 2, Harijan Basti, Karawal Nagar, Dayalpur, North East Delhi, Delhi 110094",
        "VIPIN KUMAR": "165 NEW VIKAS NAGAR LONI GHAZIABAD 201102"
    };

    function toTitleCase(str) {
        if (!str) return "";
        return str.toLowerCase().split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
    }

    // New function to convert YYYY-MM-DD to DD/MM/YYYY
    function formatToDDMMYYYY(dateStr) {
        if (!dateStr) return "N/A";
        const [year, month, day] = dateStr.split('-');
        return `${day}/${month}/${year}`;
    }

    function toggleManual(selId, divId, inpId) {
        const sel = document.getElementById(selId);
        const div = document.getElementById(divId);
        const inp = document.getElementById(inpId);
        if (sel.value === "Manual") { div.style.display = 'block'; inp.setAttribute('required', 'true'); }
        else { div.style.display = 'none'; inp.removeAttribute('required'); }
    }

    function handleWitnessChange(num) {
        const sel = document.getElementById(`w${num}Select`);
        const addr = document.getElementById(`w${num}Address`);
        toggleManual(`w${num}Select`, `manualW${num}Div`, `manualW${num}Name`);
        if (ADDRESSES[sel.value]) addr.value = ADDRESSES[sel.value];
    }

    document.getElementById('marriageForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const getVal = (sId, mId) => toTitleCase(document.getElementById(sId).value === "Manual" ? document.getElementById(mId).value : document.getElementById(sId).value);
        const val = (id) => toTitleCase(document.getElementById(id).value);
        const dateVal = (id) => formatToDDMMYYYY(document.getElementById(id).value);
        const getPin = (id) => document.getElementById(id).value;

        let msg = `*MARRIAGE REGISTRATION DETAILS*%0A%0A`;
        msg += `*Advocate:* ${getVal('advocateSelect', 'manualAdvocateName')}%0A%0A`;
        
        msg += `*♂ BOY'S INFO*%0A`;
        msg += `- Name: ${val('boyName')}%0A`;
        msg += `- Mother: ${val('boyMother')}%0A`;
        msg += `- Father: ${val('boyFather')}%0A`;
        msg += `- DOB: ${dateVal('boyDob')}%0A`;
        msg += `- Address: ${val('boyAddress')}%0A`;
        msg += `- Pincode: ${getPin('boyPincode')}%0A%0A`;

        msg += `*♀ GIRL'S INFO*%0A`;
        msg += `- Name: ${val('girlName')}%0A`;
        msg += `- Mother: ${val('girlMother')}%0A`;
        msg += `- Father: ${val('girlFather')}%0A`;
        msg += `- DOB: ${dateVal('girlDob')}%0A`;
        msg += `- Address: ${val('girlAddress')}%0A`;
        msg += `- Pincode: ${getPin('girlPincode')}%0A%0A`;

        msg += `*💍 MARRIAGE DETAILS*%0A`;
        msg += `- Center: ${getVal('centerSelect', 'manualCenterName')}%0A`;
        msg += `- Date: ${dateVal('marriageDate')}%0A%0A`;

        msg += `*👥 WITNESSES*%0A`;
        msg += `1. ${getVal('w1Select', 'manualW1Name')}%0A- Address: ${toTitleCase(document.getElementById('w1Address').value)}%0A`;
        msg += `2. ${getVal('w2Select', 'manualW2Name')}%0A- Address: ${toTitleCase(document.getElementById('w2Address').value)}`;

        window.open(`https://wa.me/919990150544?text=${msg}`, '_blank');
    });
</script>
</body>
</html>
